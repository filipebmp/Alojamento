name = "gestao-alojamento-local"
main = "src/index.ts"
compatibility_date = "2025-10-01"

# Instalação do fornecedor: domínio próprio no Cloudflare (o registo DNS é criado na publicação).
routes = [{ pattern = "painel.bookgest.pt", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "alojamento"
database_id = "SUBSTITUIR_PELO_ID_DA_BASE_DE_DADOS"
migrations_dir = "migrations"

# Verificação diária da licença (04:17 UTC)
[triggers]
crons = ["17 4 * * *"]

[vars]
# Endereço público da app, usado nos links de check-in enviados aos hóspedes
URL_PUBLICO = "https://painel.bookgest.pt"
# Servidor de licenças. Predefinido: https://bookgest.pt (quando a plataforma passar a servir esse domínio).
URL_LICENCAS = "https://bookgest-plataforma.filipebmp.workers.dev"

# Só na instalação do fornecedor: a plataforma está na mesma conta Cloudflare e o Cloudflare não deixa
# um Worker chamar outro pelo endereço workers.dev (erro 1042). A ligação direta resolve isso.
[[services]]
binding = "PLATAFORMA"
service = "bookgest-plataforma"

# A restante configuração (palavra-passe, alojamentos, código do cofre, horários,
# taxa turística) é feita no painel e guardada na base de dados.
# Segredos opcionais, só para instalações anteriores à configuração no painel
# (`wrangler secret put NOME`, ou .dev.vars localmente):
#   ADMIN_PASSWORD  - palavra-passe enquanto não for definida uma no painel
#   SESSION_SECRET  - chave do cookie de sessão (sem ela é gerada e guardada na base de dados)
#   CODIGO_CHAVES   - código do cofre copiado para o primeiro alojamento
